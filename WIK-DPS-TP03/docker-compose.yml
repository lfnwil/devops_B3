name: wik-dps-tp03

services:
  app:
    build:
      context: ../WIK-DPS-TP02
      dockerfile: Dockerfile
    deploy:
      replicas: 4
    expose:
      - "3000"

  reverse-proxy:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
